<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MSS Grade Tracker – Prototyp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14213d;--mut:#586377;--line:#d3dae6;--pri:#14213d;--onpri:#fff;--red:#b42318;--redbg:#fdecea;--ok:#1b6b4f;--okbg:#e4f4ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1524;--card:#17213a;--ink:#e8edf7;--mut:#9aa6bd;--line:#2c3855;--pri:#9dbcff;--onpri:#0e1524;--red:#ff9a90;--redbg:#3a1d21;--ok:#6fd8aa;--okbg:#17332b}}
:root[data-theme="dark"]{--bg:#0e1524;--card:#17213a;--ink:#e8edf7;--mut:#9aa6bd;--line:#2c3855;--pri:#9dbcff;--onpri:#0e1524;--red:#ff9a90;--redbg:#3a1d21;--ok:#6fd8aa;--okbg:#17332b}
html{height:100%}body{margin:0;background:var(--bg);min-height:100%;line-height:1.45}
*,*::before,*::after{box-sizing:inherit}
a{color:inherit}h1{font-size:1.6rem;margin:0 0 .25rem}h2{font-size:1.1rem;margin:0 0 .6rem}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.app{display:grid;grid-template-columns:190px 1fr;min-height:100vh}
nav{position:sticky;top:0;align-self:start;height:100vh;padding:1.2rem .8rem;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:.3rem}
nav b{padding:.2rem .6rem 1rem;font-size:1.05rem}
nav a{padding:.55rem .7rem;border-radius:8px;text-decoration:none}nav a[aria-current=page]{background:var(--pri);color:var(--onpri);font-weight:700}
main{padding:1.5rem;max-width:980px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}.grid .card{margin:0}
.sub{text-decoration:none;display:block;border-left:6px solid var(--c)}
.big{font-size:2.8rem;font-weight:700;line-height:1}.mut{color:var(--mut)}.small{font-size:.88rem}
.ruler{position:relative;height:14px;margin:.7rem 0 .3rem;border-bottom:2px solid var(--ink);background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100%/15))}
.ruler i{position:absolute;bottom:-2px;width:4px;height:22px;margin-left:-2px;background:var(--red);border-radius:2px}
.badge{display:inline-block;padding:.05rem .5rem;border-radius:99px;font-size:.8rem;background:var(--line);margin-right:.3rem}
.badge.w{background:var(--redbg);color:var(--red)}.badge.g{background:var(--okbg);color:var(--ok)}
.btn{font:inherit;padding:.5rem .9rem;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:700}.btn.d{color:var(--red)}.btn.s{padding:.2rem .55rem;font-size:.85rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.end{justify-content:flex-end;margin-top:1rem}.sp{justify-content:space-between}
label{display:block;margin:.6rem 0 .2rem;font-weight:700;font-size:.9rem}
input,select,textarea{font:inherit;width:100%;padding:.45rem .55rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:auto}input[type=color]{padding:.1rem;height:2.2rem}
td input{min-width:5rem}.w8{width:6rem}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:.4rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:.85rem;color:var(--mut)}
.alert{padding:.6rem .8rem;border-radius:8px;background:var(--redbg);color:var(--red);margin:.6rem 0}.note{padding:.6rem .8rem;border-radius:8px;background:var(--okbg);color:var(--ok);margin:.6rem 0}
.empty{text-align:center;padding:2.5rem 1rem}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(30rem,94vw);padding:1.2rem}dialog::backdrop{background:rgba(0,0,0,.45)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5rem;background:var(--pri);color:var(--onpri);padding:.5rem 1rem;border-radius:8px;display:none;z-index:9}
svg text{fill:var(--mut);font-size:11px}svg .ln{stroke:var(--ink);stroke-width:2;fill:none}svg .gl{stroke:var(--line)}svg circle{fill:var(--red)}
@media(max-width:799px){.app{display:block;padding-bottom:70px}nav{position:fixed;z-index:5;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:.3rem .5rem calc(.3rem + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);border-right:0}nav b{display:none}main{padding:1rem}}
</style></head><body>
<div class="app"><nav id="nav" aria-label="Hauptnavigation"></nav><main id="main"></main></div>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF={half:false,mode:'renormalize',theme:'system',defCats:'Klausuren:50\nMündliche Mitarbeit:30\nTests:20'};
let S={subjects:[],settings:{...DEF}},flt='';
try{const r=JSON.parse(localStorage.getItem('mssgt')||'null');if(r&&Array.isArray(r.subjects))S={subjects:r.subjects,settings:{...DEF,...r.settings}}}catch(e){}
const save=()=>{try{localStorage.setItem('mssgt',JSON.stringify(S))}catch(e){}};
const f1=n=>n==null?'–':n.toLocaleString('de-DE',{maximumFractionDigits:2});
const fd=d=>new Date(d+'T00:00:00').toLocaleDateString('de-DE'),today=()=>new Date().toISOString().slice(0,10);
const cur=()=>S.subjects.find(s=>s.id===location.hash.split('/')[2]);
const validPts=p=>Number.isFinite(p)&&p>=0&&p<=15&&((S.settings.half?p*2:p)%1===0);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3000)}
/* Berechnung (entspricht src/lib/grades.ts) */
function score(sub,grades=sub.grades){
 const act=sub.cats.filter(c=>c.active),sum=Math.round(act.reduce((s,c)=>s+c.weight,0)*100)/100;
 const steps=act.map(c=>{const g=grades.filter(x=>x.catId===c.id);return{name:c.name,n:g.length,avg:g.length?g.reduce((s,x)=>s+x.points,0)/g.length:null,w:c.weight,used:false}});
 const r={score:null,complete:false,sum,valid:Math.abs(sum-100)<0.005,steps};
 if(!r.valid){r.reason='Gewichtungen ergeben '+f1(sum)+' % statt 100 %.';return r}
 const rated=steps.filter(s=>s.avg!==null);r.complete=rated.length===steps.length;
 if(!r.complete&&S.settings.mode==='strict'){r.reason='Es fehlen Noten in gewichteten Kategorien.';return r}
 const uw=rated.reduce((s,x)=>s+x.w,0);if(uw<=0){r.reason='Noch keine Noten.';return r}
 rated.forEach(s=>s.used=true);r.score=rated.reduce((s,x)=>s+x.avg*x.w,0)/uw;return r}
function overall(){const rs=S.subjects.map(s=>({s,r:score(s)})),ok=rs.filter(x=>x.r.score!==null);
 return{ok,bad:rs.filter(x=>x.r.score===null),avg:ok.length?ok.reduce((a,x)=>a+x.r.score,0)/ok.length:null}}
function trend(sub){const g=[...sub.grades].sort((a,b)=>a.date.localeCompare(b.date));if(g.length<2)return 0;
 const a=score(sub).score,b=score(sub,g.slice(0,-1)).score;if(a==null||b==null||Math.abs(a-b)<0.05)return 0;return a>b?1:-1}
function history(){const ds=[...new Set(S.subjects.flatMap(s=>s.grades.map(g=>g.date)))].sort(),out=[];
 ds.forEach(d=>{const v=S.subjects.map(s=>score(s,s.grades.filter(g=>g.date<=d)).score).filter(x=>x!==null);if(v.length)out.push({d,v:v.reduce((a,b)=>a+b,0)/v.length})});return out}
/* Darstellung */
const ruler=v=>`<div class="ruler" role="img" aria-label="${v==null?'Noch kein Ergebnis':f1(v)+' von 15 Punkten'}">${v==null?'':`<i style="left:${v/15*100}%"></i>`}</div>`;
const arrow=t=>t>0?'<span class="badge g">↑ besser</span>':t<0?'<span class="badge w">↓ schlechter</span>':'';
const empty=(h,p,b)=>`<div class="card empty"><h2>${h}</h2><p class="mut">${p}</p>${b||''}</div>`;
function chart(){const h=history();if(!h.length)return '<p class="mut">Der Verlauf erscheint, sobald Noten mit Datum vorliegen.</p>';
 const W=600,H=190,L=28,x=i=>h.length>1?L+i*(W-L-10)/(h.length-1):(W+L)/2,y=v=>H-24-v/15*(H-40);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Verlauf des Punkteschnitts">${[0,5,10,15].map(v=>`<line class="gl" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="2" y="${y(v)+4}">${v}</text>`).join('')}<polyline class="ln" points="${h.map((p,i)=>x(i)+','+y(p.v)).join(' ')}"/>${h.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5"/>`).join('')}<text x="${L}" y="${H-4}">${fd(h[0].d)}</text><text x="${W-10}" y="${H-4}" text-anchor="end">${fd(h[h.length-1].d)}</text></svg>`}
function vDash(){
 if(!S.subjects.length)return '<h1>Übersicht</h1>'+empty('Noch keine Fächer','Lege dein erstes Fach an, trage Noten ein und gewichte die Kategorien.','<button class="btn pri" data-a="addSubject">Fach anlegen</button>');
 const o=overall(),all=S.subjects.flatMap(s=>s.grades.map(g=>({...g,s}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
 return `<div class="row sp"><h1>Übersicht</h1><button class="btn pri" data-a="addGrade">Note eintragen</button></div>
 <div class="card"><div class="row" style="align-items:baseline;gap:1.2rem"><span class="big">${f1(o.avg)}</span><span>Ø Punkte über ${o.ok.length} von ${S.subjects.length} Fächern</span></div>${ruler(o.avg)}
 <div class="row sp small mut"><span>0</span><span>15</span></div>
 ${o.avg!=null?`<p>Näherung Notendurchschnitt: <b>${f1((17-o.avg)/3)}</b> <span class="mut small">(Umrechnung (17 − P) ÷ 3, keine offizielle Abiturprognose)</span></p>`:''}
 <p class="small mut">Einbezogen: ${o.ok.map(x=>esc(x.s.name)).join(', ')||'–'}. ${o.bad.length?'Ohne Ergebnis: '+o.bad.map(x=>esc(x.s.name)).join(', ')+'.':''} Alle Fächer zählen gleich; Leistungsfächer-Doppelwertung ist nicht berücksichtigt.</p></div>
 <h2>Fächer (${S.subjects.length})</h2><div class="grid">${S.subjects.map(sub=>{const r=score(sub);return `<a class="card sub" style="--c:${esc(sub.color)}" href="#/subject/${sub.id}"><b>${esc(sub.name)}</b> <span class="mut small">${sub.kind==='leistungsfach'?'Leistungsfach':'Grundfach'}${sub.sem?' · '+esc(sub.sem):''}</span><div class="big" style="margin-top:.5rem">${f1(r.score)}</div>${ruler(r.score)}${arrow(trend(sub))}${r.score!=null&&!r.complete?'<span class="badge w">vorläufig</span>':''}${!r.valid?'<span class="badge w">Gewichtung prüfen</span>':''}</a>`}).join('')}</div>
 <div class="card" style="margin-top:1rem"><h2>Verlauf</h2>${chart()}</div>
 <div class="card"><h2>Letzte Noten</h2>${all.length?`<div class="tw"><table><tr><th>Datum</th><th>Fach</th><th>Bezeichnung</th><th>Punkte</th><th></th></tr>${all.map(g=>`<tr><td>${fd(g.date)}</td><td>${esc(g.s.name)}</td><td>${esc(g.title)}</td><td>${f1(g.points)}</td><td class="row"><button class="btn s" data-a="editGrade" data-id="${g.id}" data-sid="${g.s.id}">Ändern</button><button class="btn s d" data-a="delGrade" data-id="${g.id}" data-sid="${g.s.id}">Löschen</button></td></tr>`).join('')}</table></div>`:'<p class="mut">Noch keine Noten eingetragen.</p>'}</div>`}
function vSubjects(){return `<div class="row sp"><h1>Fächer</h1><button class="btn pri" data-a="addSubject">Fach anlegen</button></div>`+(S.subjects.length?S.subjects.map((s,i)=>{const r=score(s);return `<div class="card row sp" style="border-left:6px solid ${esc(s.color)}"><a href="#/subject/${s.id}"><b>${esc(s.name)}</b> <span class="mut small">${esc(s.short||'')} ${s.sem?'· '+esc(s.sem):''}</span></a><span class="row"><b>${f1(r.score)}</b><button class="btn s" data-a="editSubject" data-sid="${s.id}">Ändern</button><button class="btn s d" data-a="delSubject" data-sid="${s.id}">Löschen</button><button class="btn s" data-a="mv" data-id="${s.id}" data-d="-1" ${i?'':'disabled'} aria-label="Nach oben">↑</button><button class="btn s" data-a="mv" data-id="${s.id}" data-d="1" ${i<S.subjects.length-1?'':'disabled'} aria-label="Nach unten">↓</button></span></div>`}).join(''):empty('Noch keine Fächer','Fächer legst du selbst an, es gibt keine Vorgaben.',''))}
function vSub(){const s=cur();if(!s)return empty('Fach nicht gefunden','Es wurde gelöscht oder existiert nicht.','<a class="btn" href="#/subjects">Zur Fächerübersicht</a>');
 const r=score(s),cn=id=>esc((s.cats.find(c=>c.id===id)||{}).name||'?'),gs=s.grades.filter(g=>!flt||g.catId===flt).sort((a,b)=>b.date.localeCompare(a.date));
 return `<a href="#/subjects" class="small">← Fächer</a><div class="row sp"><h1>${esc(s.name)}</h1><span class="row"><button class="btn" data-a="editSubject">Bearbeiten</button><button class="btn d" data-a="delSubject">Löschen</button></span></div>
 <div class="card"><div class="big">${f1(r.score)} <span class="small mut">Punkte</span></div>${ruler(r.score)}${r.reason?`<div class="alert">${esc(r.reason)}</div>`:''}${r.score!=null&&!r.complete?'<div class="alert">Vorläufig: Kategorien ohne Noten bleiben unberücksichtigt, die übrigen werden neu gewichtet.</div>':''}
 <details><summary>Rechenweg anzeigen</summary><div class="tw"><table><tr><th>Kategorie</th><th>Noten</th><th>Ø</th><th>Gewicht</th><th>Einfluss</th></tr>${r.steps.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.n}</td><td>${f1(x.avg)}</td><td>${f1(x.w)} %</td><td>${x.used?f1(x.avg*x.w/r.steps.filter(y=>y.used).reduce((a,y)=>a+y.w,0)):'nicht berücksichtigt'}</td></tr>`).join('')}</table></div><p class="small mut">Fachpunktzahl = Σ (Ø × Gewicht) ÷ Σ verwendete Gewichte. Einfluss = Punkte, die die Kategorie zum Ergebnis beiträgt.</p></details></div>
 <div class="card"><div class="row sp"><h2>Kategorien und Gewichtung</h2><span class="row"><button class="btn" data-a="norm">Auf 100 % normalisieren</button><button class="btn" data-a="addCat">Kategorie</button></span></div>
 <p class="${r.valid?'note':'alert'}" role="status">Summe: <b>${f1(r.sum)} %</b> ${r.valid?'– passt.':'– muss genau 100 % ergeben, sonst gibt es kein Ergebnis.'}</p>
 <div class="tw"><table><tr><th>Name</th><th>Gewicht %</th><th>Aktiv</th><th>Ø</th><th></th></tr>${s.cats.map(c=>{const g=s.grades.filter(x=>x.catId===c.id);return `<tr><td><input data-f="cname" data-cat="${c.id}" value="${esc(c.name)}" aria-label="Kategoriename"></td><td><input class="w8" type="number" min="0" max="100" step="0.5" data-f="cw" data-cat="${c.id}" value="${c.weight}" aria-label="Gewicht in Prozent"></td><td><input type="checkbox" data-f="ca" data-cat="${c.id}" ${c.active?'checked':''} aria-label="Aktiv"></td><td>${g.length?f1(g.reduce((a,x)=>a+x.points,0)/g.length):'nicht bewertet'}</td><td><button class="btn s d" data-a="delCat" data-id="${c.id}">Entfernen</button></td></tr>`}).join('')}</table></div></div>
 <div class="card"><div class="row sp"><h2>Noten</h2><span class="row"><select aria-label="Kategorie filtern" data-filter style="width:auto"><option value="">Alle Kategorien</option>${s.cats.map(c=>`<option value="${c.id}" ${flt===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="btn pri" data-a="addGrade" data-id="${s.id}">Note eintragen</button></span></div>
 ${gs.length?`<div class="tw"><table><tr><th>Datum</th><th>Bezeichnung</th><th>Kategorie</th><th>Punkte</th><th></th></tr>${gs.map(g=>`<tr><td>${fd(g.date)}</td><td>${esc(g.title)}${g.note?`<div class="small mut">${esc(g.note)}</div>`:''}</td><td>${cn(g.catId)}</td><td>${f1(g.points)}</td><td class="row"><button class="btn s" data-a="editGrade" data-id="${g.id}">Ändern</button><button class="btn s d" data-a="delGrade" data-id="${g.id}">Löschen</button></td></tr>`).join('')}</table></div>`:'<p class="mut">Keine Noten in dieser Ansicht.</p>'}</div>`}
function vSet(){const t=S.settings;return `<h1>Einstellungen</h1><div class="card"><h2>Darstellung und Berechnung</h2>
 <label for="sth">Farbschema</label><select id="sth" data-s="theme"><option value="system" ${t.theme==='system'?'selected':''}>Wie Gerät</option><option value="light" ${t.theme==='light'?'selected':''}>Hell</option><option value="dark" ${t.theme==='dark'?'selected':''}>Dunkel</option></select>
 <label><input type="checkbox" data-s="half" ${t.half?'checked':''}> Halbe Punkte erlauben</label>
 <label for="smo">Kategorien ohne Noten</label><select id="smo" data-s="mode"><option value="renormalize" ${t.mode==='renormalize'?'selected':''}>Ignorieren und übrige neu gewichten (vorläufig)</option><option value="strict" ${t.mode==='strict'?'selected':''}>Streng: kein Ergebnis, bis alle bewertet sind</option></select>
 <label for="sdc">Standardkategorien für neue Fächer (Name:Gewicht je Zeile)</label><textarea id="sdc" rows="4" data-s="defCats">${esc(t.defCats)}</textarea></div>
 <div class="card"><h2>Daten</h2><p class="small mut">Prototyp: Die Daten liegen nur in diesem Browser (kein Login, keine Datenbank). Export und Import laufen über Textfelder zum Kopieren.</p><div class="row"><button class="btn" data-a="exp" data-id="json">JSON anzeigen</button><button class="btn" data-a="exp" data-id="csv">CSV anzeigen</button><button class="btn" data-a="imp">Importieren</button><button class="btn d" data-a="reset">Alle Daten löschen</button></div></div>`}
function render(){const h=location.hash||'#/',r=h.split('/')[1]||'',th=S.settings.theme;
 th==='system'?delete document.documentElement.dataset.theme:document.documentElement.dataset.theme=th;
 $('#nav').innerHTML='<b>MSS Grade Tracker</b>'+[['#/','Übersicht',''],['#/subjects','Fächer','subjects'],['#/settings','Einstellungen','settings']].map(n=>`<a href="${n[0]}" ${(r===n[2]||(r==='subject'&&n[2]==='subjects'))?'aria-current="page"':''}>${n[1]}</a>`).join('');
 $('#main').innerHTML=r==='subjects'?vSubjects():r==='subject'?vSub():r==='settings'?vSet():vDash()}
/* Dialoge */
function modal(title,body,onOk,label='Speichern'){const d=$('#dlg');d.innerHTML=`<form><h2>${title}</h2>${body}<div id="err" class="alert" style="display:none" role="alert"></div><div class="row end"><button type="button" class="btn" data-x>Abbrechen</button>${onOk?`<button class="btn pri">${label}</button>`:''}</div></form>`;
 const f=$('form',d);$('[data-x]',d).onclick=()=>d.close();f.onsubmit=e=>{e.preventDefault();const m=onOk&&onOk(new FormData(f));if(m){const x=$('#err');x.textContent=m;x.style.display='block'}else d.close()};d.showModal()}
const ask=(t,m,fn,l='Löschen')=>modal(t,`<p>${m}</p>`,()=>{fn()},l);
const field=(l,n,v='',x='')=>`<label for="f_${n}">${l}</label><input id="f_${n}" name="${n}" value="${esc(v)}" ${x}>`;
function subjectModal(s){modal(s?'Fach bearbeiten':'Fach anlegen',field('Fachname','name',s?.name,'required maxlength="80"')+field('Kürzel','short',s?.short,'maxlength="10"')+field('Halbjahr (z. B. 12/1)','sem',s?.sem)+`<label for="f_kind">Fachart</label><select id="f_kind" name="kind"><option value="grundfach">Grundfach</option><option value="leistungsfach" ${s?.kind==='leistungsfach'?'selected':''}>Leistungsfach</option></select><label for="f_color">Farbe</label><input id="f_color" name="color" type="color" value="${s?.color||'#3b6fd4'}">`,fd=>{
 const name=fd.get('name').trim();if(!name)return 'Bitte einen Fachnamen eingeben.';const v={name,short:fd.get('short').trim(),sem:fd.get('sem').trim(),kind:fd.get('kind'),color:fd.get('color')};
 if(s)Object.assign(s,v);else{const cats=S.settings.defCats.split('\n').map(l=>l.split(':')).filter(a=>a[0].trim()).map(a=>({id:uid(),name:a[0].trim(),weight:parseFloat(a[1])||0,active:true}));S.subjects.push({id:uid(),...v,cats,grades:[]})}
 save();render()})}
function gradeModal(sid,g){const sel=sid?S.subjects.find(s=>s.id===sid):null;if(!sid&&!S.subjects.length)return toast('Lege zuerst ein Fach an.');
 const co=s=>s.cats.map(c=>`<option value="${c.id}" ${g&&g.catId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
 modal(g?'Note ändern':'Note eintragen',(sel?'':`<label for="f_sub">Fach</label><select id="f_sub" name="sub">${S.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>`)+field('Bezeichnung','title',g?.title,'required maxlength="120" placeholder="z. B. Klausur 1"')+`<label for="f_cat">Kategorie</label><select id="f_cat" name="cat">${co(sel||S.subjects[0])}</select>`+field('Punkte (0 bis 15)','pts',g?.points,`required type="number" min="0" max="15" step="${S.settings.half?0.5:1}" inputmode="decimal"`)+field('Datum','date',g?.date||today(),'type="date" required')+field('Bemerkung (optional)','note',g?.note),fd=>{
  const s=sel||S.subjects.find(x=>x.id===fd.get('sub')),p=parseFloat(String(fd.get('pts')).replace(',','.')),title=fd.get('title').trim();
  if(!title)return 'Bitte eine Bezeichnung eingeben.';if(!s.cats.some(c=>c.id===fd.get('cat')))return 'Bitte eine Kategorie wählen. Lege sie bei Bedarf im Fach an.';
  if(!validPts(p))return S.settings.half?'Punkte müssen zwischen 0 und 15 liegen, in Schritten von 0,5.':'Punkte müssen eine ganze Zahl von 0 bis 15 sein. Halbe Punkte aktivierst du in den Einstellungen.';
  if(!fd.get('date'))return 'Bitte ein Datum angeben.';const v={catId:fd.get('cat'),title,points:p,date:fd.get('date'),note:fd.get('note').trim()};
  if(g)Object.assign(g,v);else s.grades.push({id:uid(),...v});save();render();toast('Note gespeichert.')});
 const ss=$('#f_sub');if(ss)ss.onchange=()=>{$('#f_cat').innerHTML=co(S.subjects.find(x=>x.id===ss.value))}}
function delCat(s,c){const n=s.grades.filter(g=>g.catId===c.id).length,rest=s.cats.filter(x=>x!==c);
 if(!n)return ask('Kategorie entfernen?',`„${esc(c.name)}“ wird entfernt.`,()=>{s.cats=rest;save();render()},'Entfernen');
 if(!rest.length)return toast('Lege zuerst eine weitere Kategorie an, in die die Noten verschoben werden können.');
 modal('Kategorie entfernen',`<p>„${esc(c.name)}“ enthält ${n} Note(n). Wohin sollen sie verschoben werden?</p><select name="to">${rest.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`,fd=>{s.grades.forEach(g=>{if(g.catId===c.id)g.catId=fd.get('to')});s.cats=rest;save();render()},'Verschieben und entfernen')}
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return 'Fach;Kategorie;Bezeichnung;Punkte;Datum;Bemerkung\n'+S.subjects.flatMap(s=>s.grades.map(g=>[s.name,(s.cats.find(c=>c.id===g.catId)||{}).name,g.title,g.points,g.date,g.note].map(q).join(';'))).join('\n')}
function importModal(){modal('Daten importieren','<p class="small mut">Füge einen zuvor exportierten JSON-Text ein. Es wird nur hinzugefügt, nichts überschrieben.</p><textarea name="j" rows="8" aria-label="JSON"></textarea>',fd=>{let d;try{d=JSON.parse(fd.get('j'))}catch(e){return 'Der Text ist kein gültiges JSON.'}
 const subs=(d&&d.subjects||[]).filter(s=>s&&s.name&&Array.isArray(s.cats)&&Array.isArray(s.grades));if(!subs.length)return 'Keine Fächer gefunden.';
 const ng=subs.reduce((a,s)=>a+s.grades.length,0);setTimeout(()=>ask('Import bestätigen?',`${subs.length} Fach/Fächer mit ${ng} Noten werden hinzugefügt.`,()=>{subs.forEach(s=>{const m={},cats=s.cats.map(c=>{const id=uid();m[c.id]=id;return{id,name:String(c.name),weight:Number(c.weight)||0,active:c.active!==false}});
  S.subjects.push({id:uid(),name:String(s.name),short:String(s.short||''),sem:String(s.sem||''),kind:s.kind==='leistungsfach'?'leistungsfach':'grundfach',color:/^#[0-9a-f]{6}$/i.test(s.color)?s.color:'#3b6fd4',cats,grades:s.grades.filter(g=>m[g.catId]&&Number(g.points)>=0&&Number(g.points)<=15).map(g=>({id:uid(),catId:m[g.catId],title:String(g.title||''),points:Number(g.points),date:String(g.date||today()),note:String(g.note||'')}))})});save();render();toast('Import abgeschlossen.')},'Hinzufügen'),50)},'Vorschau')}
/* Ereignisse */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,s=(b.dataset.sid&&S.subjects.find(x=>x.id===b.dataset.sid))||cur();
 const A={addSubject:()=>subjectModal(),editSubject:()=>subjectModal(s),
 delSubject:()=>ask('Fach löschen?',`„${esc(s.name)}“ und alle Noten werden gelöscht.`,()=>{S.subjects=S.subjects.filter(x=>x!==s);save();if(location.hash==='#/subjects')render();else location.hash='#/subjects'}),
 mv:()=>{const i=S.subjects.findIndex(x=>x.id===id),j=i+Number(b.dataset.d);if(S.subjects[j]){[S.subjects[i],S.subjects[j]]=[S.subjects[j],S.subjects[i]];save();render()}},
 addGrade:()=>gradeModal(id||(s&&s.id)),editGrade:()=>gradeModal(s.id,s.grades.find(g=>g.id===id)),
 delGrade:()=>ask('Note löschen?','Diese Note wird endgültig gelöscht.',()=>{s.grades=s.grades.filter(g=>g.id!==id);save();render()}),
 addCat:()=>modal('Kategorie hinzufügen',field('Name','name','','required maxlength="60"')+field('Gewicht in %','w','0','type="number" min="0" max="100" step="0.5"'),fd=>{const n=fd.get('name').trim();if(!n)return 'Bitte einen Namen eingeben.';if(s.cats.some(c=>c.name.toLowerCase()===n.toLowerCase()))return 'Diese Kategorie gibt es schon.';s.cats.push({id:uid(),name:n,weight:Math.min(100,Math.max(0,parseFloat(fd.get('w'))||0)),active:true});save();render()},'Hinzufügen'),
 delCat:()=>delCat(s,s.cats.find(c=>c.id===id)),
 norm:()=>{const act=s.cats.filter(c=>c.active),sum=act.reduce((a,c)=>a+c.weight,0);if(sum<=0)return toast('Trage zuerst Gewichte größer als 0 ein.');act.forEach(c=>c.weight=Math.round(c.weight/sum*10000)/100);const d=Math.round((100-act.reduce((a,c)=>a+c.weight,0))*100)/100;act[0].weight=Math.round((act[0].weight+d)*100)/100;save();render()},
 exp:()=>modal(id==='csv'?'CSV-Export':'JSON-Export',`<textarea readonly rows="10" aria-label="Exportdaten" onfocus="this.select()">${esc(id==='csv'?csv():JSON.stringify({subjects:S.subjects},null,1))}</textarea><p class="small mut">Text markieren, kopieren und in eine Datei einfügen.</p>`),
 imp:importModal,reset:()=>ask('Alle Daten löschen?','Alle Fächer, Noten und Einstellungen in diesem Browser werden gelöscht.',()=>{S={subjects:[],settings:{...DEF}};save();render()},'Alles löschen')};(A[a]||(()=>{}))()});
document.addEventListener('change',e=>{const t=e.target,s=cur();
 if(t.dataset.f&&s){const c=s.cats.find(x=>x.id===t.dataset.cat),f=t.dataset.f;
  if(f==='cname'){const v=t.value.trim();if(!v||s.cats.some(x=>x!==c&&x.name.toLowerCase()===v.toLowerCase()))toast('Name leer oder schon vergeben.');else c.name=v}
  if(f==='cw'){const v=parseFloat(String(t.value).replace(',','.'));c.weight=Number.isFinite(v)?Math.min(100,Math.max(0,v)):0}
  if(f==='ca')c.active=t.checked;save();render()}
 if(t.dataset.filter!==undefined){flt=t.value;render()}
 if(t.dataset.s){const k=t.dataset.s;S.settings[k]=t.type==='checkbox'?t.checked:t.value;save();render()}});
addEventListener('hashchange',()=>{flt='';render()});render();
</script></body></html>
